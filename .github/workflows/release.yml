name: Release

# Publishing `agentship`. Two halves, both deliberate:
#
# 1. On every push to main, Changesets opens (or updates) a "Version packages" pull
#    request. Nothing is published by merging code — a release is a reviewed diff.
# 2. When that pull request lands, the same job publishes the version it created.
#
# The publish step runs with `--provenance` through OIDC, so every version carries a
# verifiable link to this repository, this commit and this workflow. There is no long-lived
# token in the runner: NPM_TOKEN is a granular automation token scoped to this package, and
# when it is absent the job stops at `npm publish --dry-run`, which is how the pipeline is
# exercised before the account exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A release never goes out on a red build.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm e2e:mock
      - run: pnpm check:docs
      - run: pnpm build

      - name: Version pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          # With no token there is nothing to publish with, so the action only opens the
          # version pull request and the rehearsal below takes over.
          publish: ${{ env.NPM_TOKEN != '' && 'pnpm changeset publish' || '' }}
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is a publish-time flag; setting it here applies it to whatever
          # `changeset publish` ends up publishing.
          NPM_CONFIG_PROVENANCE: 'true'

      # Without a token nothing can be published, and that is a supported state: the
      # pipeline still proves it would work, end to end, against the real registry.
      - name: Rehearse the publish (no token configured)
        if: env.NPM_TOKEN == ''
        run: pnpm --filter agentship exec npm publish --dry-run
