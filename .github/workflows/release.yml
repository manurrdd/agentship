name: Release

# Publishing `agentship`. Two halves, both deliberate:
#
# 1. On every push to main, Changesets opens (or updates) a "Version packages" pull
#    request. Nothing is published by merging code — a release is a reviewed diff.
# 2. When that pull request lands, the same job publishes the version it created.
#
# There is no npm token anywhere: `agentship` names this repository and this workflow file
# as a trusted publisher, so the runner exchanges its OIDC identity for a credential that is
# short-lived and good for nothing else. The package can therefore keep npm's strictest
# setting — two-factor authentication required, tokens disallowed — and a stolen token stops
# being a way to publish, because there is none. Provenance is generated automatically on
# this path, which is why no `--provenance` flag appears below.
#
# Trusted publishing needs npm 11.5.1 or later, which needs Node 22.14 or later; the Node
# version here is what puts a new enough npm on the runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # The whole of the publish credential: npm trades this OIDC token for a short-lived
      # one, scoped to this package, this repository and this workflow file.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Newer than CI's on purpose: npm 11.5.1+ is what can publish through OIDC at all.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A release never goes out on a red build.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm e2e:mock
      - run: pnpm check:docs
      - run: pnpm build

      # Which half runs is decided by the repository, not by this file: with changesets
      # pending it opens the version pull request, and with none left it publishes what that
      # pull request produced. No npm credential is passed in — the action finds the OIDC
      # token and uses trusted publishing.
      - name: Version pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
